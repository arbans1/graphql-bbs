spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: bbs

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    http:
      path: /graphql

jwt:
  access-secret: ${JWT_SECRET}
  refresh-secret: ${REFRESH_JWT_SECRET}
  access-expiration: 3600000  # 1 시간(밀리초)
  refresh-expiration: 604800000  # 7 일(밀리초)
