spring:
  datasource:
    url: jdbc:h2:mem:testdb_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

jwt:
  access-secret: "test_secret_key_for_access_token_at_least_32_characters_long"
  refresh-secret: "test_secret_key_for_refresh_token_at_least_32_characters_long"
  access-expiration: 3600000
  refresh-expiration: 604800000
