mutation RefreshToken {
  auth {
    refreshToken {
      ... on AuthPayload {
        accessToken
        expiresIn
        user {
          id
          email
          role
          status
        }
      }
      ... on AuthenticationError {
        message
        code
      }
      ... on ForbiddenError {
        message
        code
      }
    }
  }
}
